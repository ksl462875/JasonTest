name: Claude Code (comment-trigger)
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          custom_instructions: |
            接下來請你一律使用**正體中文（台灣用語）**回覆。
            在 PR/Issue 上的所有評論都以繁體中文撰寫，條列清楚、精簡到點。
            對於程式碼建議請附上「原因」與「範例差異（before/after）」。
